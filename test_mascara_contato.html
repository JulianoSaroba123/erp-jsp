<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Máscara - Campo Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h5>Teste de Máscara - Campo Contato</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Contato (com máscara)</label>
                        <input id="contato" name="contato" class="form-control" maxlength="15" placeholder="(00) 00000-0000">
                        <small class="text-muted">Digite um número de telefone para testar a máscara</small>
                    </div>
                </div>
                
                <div class="row mt-3">
                    <div class="col-12">
                        <h6>Instruções:</h6>
                        <ul>
                            <li>Digite números no campo acima</li>
                            <li>A máscara deve formatar automaticamente no padrão (XX) XXXXX-XXXX</li>
                            <li>Exemplo: Digite 11999887766 e deve aparecer (11) 99988-7766</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery e Plugin de Máscara -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    
    <!-- Script para aplicar a máscara -->
    <script>
        $(document).ready(function() {
            console.log('Página carregada, aplicando máscara...');
            
            if ($('#contato').length) {
                $('#contato').mask('(00) 00000-0000');
                console.log('Máscara aplicada ao campo contato');
            } else {
                console.log('Campo contato não encontrado');
            }
            
            // Teste adicional - monitorar eventos
            $('#contato').on('input', function() {
                console.log('Valor do campo:', $(this).val());
            });
        });
    </script>
</body>
</html>
