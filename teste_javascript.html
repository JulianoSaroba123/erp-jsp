<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do JavaScript do Formulário</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        .form-control, .form-select {
            background-color: rgba(15,31,54,.55);
            border: 1px solid rgba(255,255,255,.12);
            color: #ffffff;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: rgba(15,31,54,.65);
            border-color: rgba(86,212,255,.65);
            box-shadow: 0 0 0 .2rem rgba(86,212,255,.12);
            color: #ffffff;
        }
        
        .btn-primary {
            background-color: #29b6ff;
            border-color: #29b6ff;
        }
        
        .btn-primary:hover {
            background-color: #1ea0e6;
            border-color: #1ea0e6;
        }
        
        .alert {
            margin: 10px 0;
        }
        
        .debug-info {
            background-color: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2><i class="fas fa-bug"></i> Teste do JavaScript do Formulário de OS</h2>
                <p class="text-muted">Este teste simula o formulário de edição para identificar problemas no JavaScript</p>
                
                <div id="alertas"></div>
                
                <!-- Formulário de teste -->
                <form id="form-os-teste" onsubmit="return validarFormulario();">
                    <div class="card bg-dark border-secondary mb-3">
                        <div class="card-header">
                            <i class="fas fa-user"></i> Dados do Cliente
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Cliente *</label>
                                    <input id="cliente_input" name="cliente_nome" class="form-control"
                                           value="MR JACKY CONFECCAO E REPRESENTACAO LTDA" required>
                                    <input type="hidden" id="cliente_id" name="cliente_id" value="8">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Solicitante</label>
                                    <input id="solicitante" name="solicitante" class="form-control"
                                           value="João Silva">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Contato</label>
                                    <input id="contato" name="contato" class="form-control"
                                           value="(11) 99999-9999">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card bg-dark border-secondary mb-3">
                        <div class="card-header">
                            <i class="fas fa-clipboard-list"></i> Detalhes da OS
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <label class="form-label">Código</label>
                                    <input id="codigo" name="codigo" class="form-control" readonly value="OS0351">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Data de Emissão *</label>
                                    <input type="date" id="data_emissao" name="data_emissao" class="form-control"
                                           value="2024-01-15" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Status</label>
                                    <select id="status" name="status" class="form-select">
                                        <option value="Aberta">Aberta</option>
                                        <option value="Em Andamento" selected>Em Andamento</option>
                                        <option value="Concluída">Concluída</option>
                                        <option value="Cancelada">Cancelada</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Prioridade</label>
                                    <select id="prioridade" name="prioridade" class="form-select">
                                        <option value="Baixa">Baixa</option>
                                        <option value="Média" selected>Média</option>
                                        <option value="Alta">Alta</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card bg-dark border-secondary mb-3">
                        <div class="card-header">
                            <i class="fas fa-cogs"></i> Equipamento
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Nome do Equipamento</label>
                                    <input id="equipamento_nome" name="equipamento_nome" class="form-control"
                                           value="Compressor Industrial">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Marca</label>
                                    <input id="equipamento_marca" name="equipamento_marca" class="form-control"
                                           value="Atlas Copco">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Campos hidden para dados estruturados -->
                    <input type="hidden" id="servicos_json" name="servicos_json" value="">
                    <input type="hidden" id="produtos_json" name="produtos_json" value="">
                    <input type="hidden" id="parcelas_json" name="parcelas_json" value="">
                    
                    <div class="text-center">
                        <button type="button" class="btn btn-outline-info me-2" onclick="testarValidacao()">
                            <i class="fas fa-check"></i> Testar Validação
                        </button>
                        <button type="button" class="btn btn-outline-warning me-2" onclick="testarCampos()">
                            <i class="fas fa-list"></i> Testar Campos
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Simular Envio
                        </button>
                    </div>
                </form>
                
                <div class="debug-info mt-4">
                    <strong>Debug Info:</strong>
                    <div id="debug-output"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript de teste -->
    <script>
        // Funções de debug
        function log(mensagem) {
            const debugOutput = document.getElementById('debug-output');
            const timestamp = new Date().toLocaleTimeString();
            debugOutput.innerHTML += `<div>[${timestamp}] ${mensagem}</div>`;
            console.log(mensagem);
        }
        
        function mostrarAlerta(tipo, mensagem) {
            const alertas = document.getElementById('alertas');
            alertas.innerHTML = `
                <div class="alert alert-${tipo} alert-dismissible fade show">
                    ${mensagem}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Arrays para armazenar serviços e produtos (do código original)
        let servicos = [];
        let produtos = [];
        let parcelas = [];

        // Função de validação (copiada do original)
        function validarFormulario() {
            log('🔍 Iniciando validação do formulário...');
            
            const clienteNome = document.getElementById('cliente_input').value.trim();
            const dataEmissao = document.getElementById('data_emissao').value;
            
            log(`Cliente nome: "${clienteNome}"`);
            log(`Data emissão: "${dataEmissao}"`);
            
            if (!clienteNome) {
                log('❌ Validação falhou: Nome do cliente vazio');
                mostrarAlerta('danger', 'Nome do cliente é obrigatório.');
                document.getElementById('cliente_input').focus();
                return false;
            }
            
            if (!dataEmissao) {
                log('❌ Validação falhou: Data de emissão vazia');
                mostrarAlerta('danger', 'Data de emissão é obrigatória.');
                document.getElementById('data_emissao').focus();
                return false;
            }
            
            log('✅ Validação básica passou!');
            
            // Salvar dados nos campos hidden (do código original)
            document.getElementById('servicos_json').value = JSON.stringify(servicos);
            document.getElementById('produtos_json').value = JSON.stringify(produtos);
            document.getElementById('parcelas_json').value = JSON.stringify(parcelas);
            
            log(`Servicos JSON: ${JSON.stringify(servicos)}`);
            log(`Produtos JSON: ${JSON.stringify(produtos)}`);
            log(`Parcelas JSON: ${JSON.stringify(parcelas)}`);
            
            // SIMULAR ENVIO (não enviar de verdade)
            log('🚀 Simulando envio do formulário...');
            mostrarAlerta('success', 'Formulário validado com sucesso! (Envio simulado)');
            
            // Impedir envio real
            return false;
        }

        // Função para testar validação
        function testarValidacao() {
            log('🧪 Iniciando teste de validação...');
            
            // Teste 1: Campos vazios
            log('Teste 1: Campos vazios');
            document.getElementById('cliente_input').value = '';
            document.getElementById('data_emissao').value = '';
            
            if (!validarFormulario()) {
                log('✅ Teste 1 passou: Validação rejeitou campos vazios');
            } else {
                log('❌ Teste 1 falhou: Validação aceitou campos vazios');
            }
            
            // Restaurar valores
            document.getElementById('cliente_input').value = 'MR JACKY CONFECCAO E REPRESENTACAO LTDA';
            document.getElementById('data_emissao').value = '2024-01-15';
            
            // Teste 2: Campos preenchidos
            log('Teste 2: Campos preenchidos');
            if (!validarFormulario()) {
                log('✅ Teste 2 passou: Validação com campos preenchidos funcionou');
            } else {
                log('❌ Teste 2 falhou: Problema na validação');
            }
        }

        // Função para testar campos
        function testarCampos() {
            log('🔍 Testando acesso aos campos...');
            
            const campos = [
                'cliente_input',
                'cliente_id', 
                'solicitante',
                'contato',
                'codigo',
                'data_emissao',
                'status',
                'prioridade',
                'equipamento_nome',
                'equipamento_marca',
                'servicos_json',
                'produtos_json',
                'parcelas_json'
            ];
            
            let camposOk = 0;
            campos.forEach(campo => {
                const elemento = document.getElementById(campo);
                if (elemento) {
                    log(`✅ Campo "${campo}": ${elemento.tagName} - Valor: "${elemento.value}"`);
                    camposOk++;
                } else {
                    log(`❌ Campo "${campo}": NÃO ENCONTRADO`);
                }
            });
            
            log(`Resultado: ${camposOk}/${campos.length} campos encontrados`);
            
            if (camposOk === campos.length) {
                mostrarAlerta('success', 'Todos os campos foram encontrados!');
            } else {
                mostrarAlerta('warning', `Apenas ${camposOk}/${campos.length} campos encontrados`);
            }
        }

        // Inicializar ao carregar a página
        document.addEventListener('DOMContentLoaded', function() {
            log('📄 Página carregada, JavaScript inicializado');
            log('🔧 Formulário de teste pronto');
            
            // Testar se elementos básicos existem
            const form = document.getElementById('form-os-teste');
            if (form) {
                log('✅ Formulário encontrado');
            } else {
                log('❌ Formulário NÃO encontrado');
            }
            
            mostrarAlerta('info', 'Teste do JavaScript carregado! Clique nos botões para testar.');
        });
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
